# AcademicOS reverse proxy (V3 M19, ADR-066).
#
# TLS termination + rate limiting + backend/frontend routing. TLS is
# terminated here; the app speaks plain HTTP on the internal compose network.
# Replace `academicos.example` with the real host and drop real cert/key paths
# in production.

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# Global request rate limit (defense-in-depth; the app layer also enforces).
limit_req_zone $binary_remote_addr zone=academicos_api:10m rate=20r/s;

server {
    listen 80;
    server_name academicos.example;
    # Redirect all HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name academicos.example;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # API -> backend.
    location /api/ {
        limit_req zone=academicos_api burst=40 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend.
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
