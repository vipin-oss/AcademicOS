[project]
name = "academicos-backend"
version = "0.1.0"
description = "AcademicOS API — Object-Centric Knowledge Graph (frozen architecture)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
markers = [
    "slow_timing: intake throughput/timing-sensitive tests (large single-worker queue drain under a hard wall-clock settle deadline); excluded from CI via '-m not slow_timing' but fully runnable locally",
]
