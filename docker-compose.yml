# AcademicOS infrastructure services (PostgreSQL + Qdrant + Ollama).
#
#   docker compose up -d db qdrant ollama
#
# Then point the backend at them:
#   DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/academicos
#   QDRANT_URL=http://localhost:6333
#   AI_PROVIDERS_JSON=[{"provider_id":"local-ollama","kind":"openai","model":"llama3.2","base_url":"http://localhost:11434/v1","api_key":"","streaming_enabled":true}]
#
# First time only — pull the model inside the Ollama container:
#   docker exec academicos-ollama ollama pull llama3.2
#
# The application itself runs natively (uvicorn) — no application image
# is required for local development.
services:
  db:
    image: postgres:16-alpine
    container_name: academicos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: academicos
    ports:
      - "5432:5432"
    volumes:
      - academicos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: academicos-qdrant
    ports:
      - "6333:6333"
    volumes:
      - academicos_qdrant:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: academicos-ollama
    ports:
      - "11434:11434"
    volumes:
      - academicos_ollama:/root/.ollama

volumes:
  academicos_pgdata:
  academicos_qdrant:
  academicos_ollama:
