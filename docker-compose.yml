# AcademicOS infrastructure services (PostgreSQL + Qdrant).
#
#   docker compose up -d db qdrant
#
# Then point the backend at them:
#   DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/academicos
#   QDRANT_URL=http://localhost:6333
#
# The application itself runs natively (uvicorn) — no application image
# is required for local development.
services:
  db:
    image: postgres:16-alpine
    container_name: academicos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: academicos
    ports:
      - "5432:5432"
    volumes:
      - academicos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: academicos-qdrant
    ports:
      - "6333:6333"
    volumes:
      - academicos_qdrant:/qdrant/storage

volumes:
  academicos_pgdata:
  academicos_qdrant:
